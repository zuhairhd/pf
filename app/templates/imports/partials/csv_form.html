{% if form_error %}
<div class="alert alert-warning py-2" role="alert">{{ form_error }}</div>
{% endif %}

<form
    hx-post="/imports/ui/csv"
    hx-target="#import-workspace"
    hx-swap="innerHTML"
    hx-encoding="multipart/form-data"
    class="row g-3"
>
    <div class="col-12">
        <label class="form-label small text-muted mb-1">CSV file</label>
        <input type="file" name="file" accept=".csv,.txt,text/csv,text/plain" class="form-control form-control-sm" required>
    </div>
    <div class="col-12">
        <label class="form-label small text-muted mb-1">Column mapping (optional JSON)</label>
        <textarea name="mapping" class="form-control form-control-sm" rows="2"
            placeholder='{"date": "Transaction Date", "amount": "Value"}'></textarea>
        <div class="form-text">Leave blank to auto-detect columns like Date, Description, Amount, Debit, Credit.</div>
    </div>
    <div class="col-12">
        <button type="submit" class="btn btn-sm btn-primary">
            <i class="bi bi-upload"></i> Upload and Preview
        </button>
    </div>
</form>
